<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back">← Back to Home</a>

    <h1>Report an Item</h1>

    <p class="subtitle">
        Tell us about the item you lost or found.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Report Type</label>

<select name="report_type" required>
    <option value="LOST" {% if report_type == "LOST" %}selected{% endif %}>
        I Lost Something
    </option>

    <option value="FOUND" {% if report_type == "FOUND" %}selected{% endif %}>
        I Found Something
    </option>
</select>

        <label>Item Name</label>
        <input
            type="text"
            name="item_name"
            placeholder="e.g. Black Wallet"
            required
        >

        <label>Category</label>
        <select name="category" required>
            <option value="">Select category</option>
            <option value="ID_CARD">ID Card</option>
            <option value="WALLET">Wallet</option>
            <option value="KEYS">Keys</option>
            <option value="ELECTRONICS">Electronics</option>
            <option value="BOOKS">Books</option>
            <option value="OTHER">Other</option>
        </select>

        <label>Description</label>
        <textarea
            name="description"
            placeholder="Describe the item..."
            required
        ></textarea>

        <label>Location</label>
        <input
            type="text"
            name="location"
            placeholder="Where was it lost/found?"
            required
        >

        <label>Date</label>
        <input
            type="date"
            name="item_date"
            required
        >

        <label>Image</label>
        <input
            type="file"
            name="image"
            accept="image/*"
        >

        <button type="submit">
            Submit Report
        </button>

    </form>

</div>

</body>
</html>
